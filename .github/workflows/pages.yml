name: Publish collection

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        id: preview
        uses: actions/upload-artifact@v6
        with:
          name: site-preview-pr-${{ github.event.pull_request.number }}
          path: _site
          include-hidden-files: true
          retention-days: 14
      - name: Link to PR preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          echo "Download the [complete site preview]($PREVIEW_URL), unzip it, and open index.html in your browser." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload publication bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
