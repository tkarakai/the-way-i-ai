<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 290" role="img" aria-labelledby="roles-title roles-desc"><style>svg{color:var(--ink,#252e29)}text{font-family:var(--sans,sans-serif);fill:currentColor}.diagram-line{fill:none;stroke:var(--accent,#275b43);stroke-width:2}.diagram-muted{fill:none;stroke:var(--line,#b5beb1);stroke-width:1.5}.diagram-node{fill:var(--surface,#fffef9);stroke:var(--accent,#275b43);stroke-width:1.5}.diagram-fill{fill:var(--tint,#e6ede3)}.diagram-dot{fill:var(--accent,#275b43)}</style><title id="roles-title">Three layers of an agent role</title><desc id="roles-desc">A professional lens shapes reasoning. The local environment supplies access and actions. A discoverable profile makes these capabilities visible to collaborators.</desc>
