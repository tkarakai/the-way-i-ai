<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" role="img" aria-labelledby="cover-starter-title cover-starter-desc">
  <title id="cover-starter-title">Different products, a reusable foundation</title>
  <desc id="cover-starter-desc">A dashboard, a mobile-first product, and a full-screen experience can use reusable starter capabilities through supported extension points without sharing a fixed application layout.</desc>
  <style>svg{color:var(--ink,#252e29)}text{font-family:var(--sans,sans-serif);fill:currentColor}.diagram-line{fill:none;stroke:var(--accent,#275b43);stroke-width:2}.diagram-muted{fill:none;stroke:var(--line,#b5beb1);stroke-width:1.5}.diagram-node{fill:var(--surface,#fffef9);stroke:var(--accent,#275b43);stroke-width:1.5}</style>
  <g id="cover-starter-products"><title>Independent downstream product shapes</title><rect class="diagram-node" x="34" y="25" width="112" height="58" rx="3"/><path class="diagram-muted" d="M57 25V83M57 43H146"/><rect class="diagram-node" x="203" y="20" width="34" height="66" rx="5"/><path class="diagram-muted" d="M216 77H224"/><rect class="diagram-node" x="294" y="25" width="112" height="58" rx="3"/><path class="diagram-muted" d="M310 40h21v13h-21zM349 55h39v13h-39zM331 47h34v8"/><text x="90" y="104" text-anchor="middle" font-size="11">Dashboard</text><text x="220" y="104" text-anchor="middle" font-size="11">Mobile-first</text><text x="350" y="104" text-anchor="middle" font-size="11">Full-screen</text></g>
  <path class="diagram-line" d="M90 115V143M220 115V143M350 115V143"/>
  <g id="cover-starter-foundation"><title>Reusable platform and supported extension points</title><rect class="diagram-node" x="34" y="143" width="372" height="46" rx="3"/><text x="220" y="172" text-anchor="middle" font-size="14">Reusable platform · supported extension points</text></g>
</svg>
