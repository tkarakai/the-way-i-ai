<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 340" role="img" aria-labelledby="upgrade-title upgrade-desc">
  <title id="upgrade-title">A semantic three-way starter upgrade</title>
  <desc id="upgrade-desc">The old starter baseline A evolves separately into the current business application B and target starter C. Compare both paths, plan and reconcile their changes, and validate the resulting upgraded application D.</desc>
  <style>svg{color:var(--ink,#252e29)}text{font-family:var(--sans,sans-serif);fill:currentColor}.diagram-line{fill:none;stroke:var(--accent,#275b43);stroke-width:2}.diagram-muted{fill:none;stroke:var(--line,#b5beb1);stroke-width:1.5}.diagram-node{fill:var(--surface,#fffef9);stroke:var(--accent,#275b43);stroke-width:1.5}.diagram-dot{fill:var(--accent,#275b43)}</style>
  <path class="diagram-muted" d="M225 67V82H111V111M225 82H339V111"/>
  <path class="diagram-line" d="m107 105 4 6 4-6m220 0 4 6 4-6M111 178V204H225V211M225 235V249M339 178V204H225m-4 39 4 6 4-6"/>
  <g id="upgrade-baseline"><title>A: Old starter baseline</title><rect class="diagram-node" x="126" y="13" width="198" height="54" rx="3"/><text x="143" y="45" font-size="12">A</text><text x="168" y="45" font-size="15">Old starter baseline</text></g>
  <g id="upgrade-app"><title>B: Current business application</title><rect class="diagram-node" x="18" y="112" width="186" height="66" rx="3"/><text x="34" y="137" font-size="12">B</text><text x="59" y="138" font-size="15">Business app</text><text x="34" y="161" font-size="11">Product changes since A</text></g>
  <g id="upgrade-starter"><title>C: Target starter release</title><rect class="diagram-node" x="246" y="112" width="186" height="66" rx="3"/><text x="262" y="137" font-size="12">C</text><text x="287" y="138" font-size="15">Target starter</text><text x="262" y="161" font-size="11">Platform changes since A</text></g>
  <text x="225" y="227" text-anchor="middle" font-size="11">Plan · reconcile · validate</text>
  <g id="upgrade-result"><title>D: Validated upgraded application</title><rect class="diagram-node" x="80" y="250" width="290" height="66" rx="3"/><text x="98" y="277" font-size="12">D</text><text x="125" y="278" font-size="16">Upgraded application</text><text x="125" y="299" font-size="11">Business intent + target contract</text></g>
</svg>
