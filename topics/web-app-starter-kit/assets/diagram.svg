<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 365" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">A starter architecture that leaves room for the business application</title>
  <desc id="architecture-desc">Reusable platform capabilities connect to an independently owned business application through explicit extension and configuration contracts. Validation and upgrade tooling support both. Agent experiments help refine the boundaries.</desc>
  <style>svg{color:var(--ink,#252e29)}text{font-family:var(--sans,sans-serif);fill:currentColor}.diagram-line{fill:none;stroke:var(--accent,#275b43);stroke-width:2}.diagram-muted{fill:none;stroke:var(--line,#b5beb1);stroke-width:1.5}.diagram-node{fill:var(--surface,#fffef9);stroke:var(--accent,#275b43);stroke-width:1.5}</style>
  <path class="diagram-line" d="M160 94V124M160 174V204"/>
  <path class="diagram-muted" d="M303 54H327M303 248H327"/>
  <g id="architecture-platform"><title>Reusable platform capabilities</title><rect class="diagram-node" x="18" y="18" width="285" height="76" rx="3"/><text x="36" y="47" font-size="17">Reusable platform</text><text x="36" y="72" font-size="12">Auth · sessions · data · security</text></g>
  <g id="architecture-extensions"><title>Supported extension space</title><rect class="diagram-node" x="18" y="124" width="285" height="50" rx="3"/><text x="160" y="154" text-anchor="middle" font-size="14">Extension &amp; configuration contracts</text></g>
  <g id="architecture-business"><title>Business-owned application and replaceable UI</title><rect class="diagram-node" x="18" y="204" width="285" height="88" rx="3"/><text x="36" y="233" font-size="17">Business application</text><text x="36" y="256" font-size="12">Own UI, workflows, and branding</text><text x="36" y="277" font-size="12">Own strings and supported overrides</text></g>
  <g id="architecture-tooling"><title>Starter-provided validation and upgrade tooling</title><rect class="diagram-node" x="327" y="18" width="105" height="274" rx="3"/><text x="379" y="105" text-anchor="middle" font-size="15">Tooling</text><text x="379" y="144" text-anchor="middle" font-size="12">Inspect</text><text x="379" y="169" text-anchor="middle" font-size="12">Validate</text><text x="379" y="194" text-anchor="middle" font-size="12">Plan</text><text x="379" y="219" text-anchor="middle" font-size="12">Upgrade</text></g>
  <g id="architecture-experiments"><title>Use agent experiments to refine the architecture</title><rect class="diagram-node" x="18" y="315" width="414" height="38" rx="3"/><text x="225" y="340" text-anchor="middle" font-size="13">Agent experiments → refine the boundaries</text></g>
</svg>
