<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 290" role="img" aria-labelledby="workflow-title workflow-desc"><style>svg{color:var(--ink,#252e29)}text{font-family:var(--sans,sans-serif);fill:currentColor}.diagram-line{fill:none;stroke:var(--accent,#275b43);stroke-width:2}.diagram-muted{fill:none;stroke:var(--line,#b5beb1);stroke-width:1.5}.diagram-node{fill:var(--surface,#fffef9);stroke:var(--accent,#275b43);stroke-width:1.5}.diagram-fill{fill:var(--tint,#e6ede3)}.diagram-dot{fill:var(--accent,#275b43)}</style><title id="workflow-title">The task moves between the main and task worktrees</title><desc id="workflow-desc">Create and implement in an isolated worktree. Review from the main window, address feedback in the task window, merge on GitHub, then clean up and pull main.</desc>
  <text x="43" y="30" font-size="11" letter-spacing="1">MAIN / HOME BASE</text><text x="266" y="30" font-size="11" letter-spacing="1">TASK WORKTREE</text>
  <path class="diagram-muted" d="M95 52V256M324 52V232"/>
  <g id="workflow-create"><title>Create a worktree</title><path class="diagram-line" d="M95 62C173 62 235 78 324 78"/><circle class="diagram-dot" cx="95" cy="62" r="6"/><circle class="diagram-node" cx="324" cy="78" r="8"/></g>
  <g id="workflow-work"><title>Do the work and open a pull request</title><path class="diagram-line" d="M324 78V124"/><circle class="diagram-dot" cx="324" cy="124" r="6"/><text x="236" y="112" font-size="12">build &amp; ship</text></g>
  <g id="workflow-review"><title>Review from main and address feedback in the task window</title><path class="diagram-line" d="M324 135C235 135 178 151 95 151M95 164C178 164 235 180 324 180"/><path class="diagram-line" d="m104 144-9 7 9 7m211 15 9 7-9 7"/><circle class="diagram-node" cx="95" cy="158" r="8"/><text x="143" y="128" font-size="12">review ↔ revise</text></g>
  <g id="workflow-merge"><title>Merge on GitHub</title><path class="diagram-line" d="M324 180C324 213 150 225 95 225"/><circle class="diagram-node" cx="95" cy="225" r="8"/><text x="191" y="220" font-size="12">merge</text></g>
  <g id="workflow-clean"><title>Clean up the task worktree</title><path class="diagram-line" d="m318 228 12 12m0-12-12 12"/><text x="345" y="239" font-size="12">clean up</text></g>
  <g id="workflow-pull"><title>Pull the merged code into main</title><path class="diagram-line" d="M95 233V268"/><circle class="diagram-dot" cx="95" cy="268" r="6"/><text x="116" y="272" font-size="12">pull main</text></g></svg>